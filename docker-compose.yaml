services:
  user-service:
    build: user-service
    image: user-service
    container_name: user-service
    ports:
      - "8080:8080"
    depends_on:
      - simple-bank-db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://simple-bank-db:5432/simple_bank
      - SPRING_DATASOURCE_USERNAME=qwerty
      - SPRING_DATASOURCE_PASSWORD=qwerty

  simple-bank-db:
    image: postgres:16-alpine
    container_name: simple_bank_db
    environment:
      - POSTGRES_DB=simple_bank
      - POSTGRES_USER=qwerty
      - POSTGRES_PASSWORD=qwerty
    ports:
      - "6541:5432"